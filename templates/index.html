<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Berry</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(45deg, #6a7bd1, #41e1ae);
    font-family: Arial, sans-serif;
    position: relative;
    overflow: hidden;
  }

/* ================= Glass Logo ================= */
.glass-logo {
  position: fixed;
  top: 16px;
  left: 16px;

  width: 78px;          /* Bigger logo */
  height: auto;

  /* Glass illusion */
  filter:
    drop-shadow(0 6px 20px rgba(0, 0, 0, 0.35))
    drop-shadow(0 0 10px rgba(65, 225, 174, 0.6));

  opacity: 0.95;

  cursor: pointer;
  transition: transform 0.25s ease, filter 0.25s ease;
}

.glass-logo:hover {
  transform: scale(1.08);
  filter:
    drop-shadow(0 10px 30px rgba(0, 0, 0, 0.45))
    drop-shadow(0 0 14px rgba(65, 225, 174, 0.9));
}

  /* ================= Profile (Top Right) ================= */
  .profile {
    position: fixed;
    top: 18px;
    right: 18px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #1abc9c;
    color: #0f172a;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* ================= Watermark ================= */
  .watermark {
    position: absolute;
    top: 35%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 100px;
    font-weight: 700;
    letter-spacing: 4px;
    color: rgba(255, 255, 255, 0.12);
    user-select: none;
  }

  /* ================= Prompt Bar ================= */
  .prompt-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    width: min(90%, 700px);
    padding: 14px 18px;
    background: rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(14px);
    border-radius: 50px;
  }

  .prompt-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-size: 16px;
    color: white;
  }

  .prompt-input::placeholder {
    color: rgba(255,255,255,0.6);
  }

  .icon-btn {
    background: transparent;
    border: none;
    color: white;
    font-size: 26px;
    cursor: pointer;
  }

  .send-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .send-btn span {
    color: #6a7bd1;
  }

  /* ================= Bottom Right Tools ================= */
  .bottom-tools {
    position: fixed;
    bottom: 18px;
    right: 18px;
    display: flex;
    gap: 18px;
    padding: 12px 16px;

    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(14px);
    border-radius: 50px;
  }

  .bottom-tools button {
    background: transparent;
    border: none;
    cursor: pointer;
    color: white;
    font-size: 24px;
    transition: transform 0.2s;
  }

  .bottom-tools button:hover {
    transform: scale(1.15);
  }
</style>
</head>

<body>
    <img src="https://logo-icons.com/cdn/shop/files/4765-logo-1739200822.556color-003932.svg?v=1739228536&width=416" alt="Berry Logo" class="glass-logo">

<!-- Profile -->
<div class="profile">AB</div>

<!-- Watermark -->
<div class="watermark">Berry</div>

<!-- Prompt -->
<div class="prompt-container">
  <button class="icon-btn"><span class="material-icons">add</span></button>

  <input
    type="text"
    class="prompt-input"
    id="promptInput"
    placeholder="Ask anything..."
    oninput="toggleIcon()"
  >

  <button class="icon-btn"><span class="material-icons">mic</span></button>

  <button class="send-btn">
    <span class="material-icons" id="actionIcon">graphic_eq</span>
  </button>
</div>

<!-- Bottom Right Tools -->
<div class="bottom-tools">
  <button><span class="material-icons">edit</span></button>
  <button><span class="material-icons">search</span></button>
  <button><span class="material-icons">image</span></button>
</div>

<script>
  function toggleIcon() {
    const input = document.getElementById("promptInput");
    const icon = document.getElementById("actionIcon");
    icon.textContent = input.value.trim() ? "send" : "graphic_eq";
  }
</script>

</body>
</html>
