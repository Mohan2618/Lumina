<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Berry</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(45deg, #6a7bd1, #41e1ae);
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* Logo */
.glass-logo {
  position: fixed;
  top: 16px;
  left: 16px;
  width: 78px;
  cursor: pointer;
}

/* Auth Buttons */
.auth-buttons {
  position: fixed;
  top: 18px;
  right: 18px;
  display: flex;
  gap: 12px;
}

.auth-buttons button {
  padding: 8px 16px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
}

/* Profile */
.profile {
  display: none;
  position: fixed;
  top: 18px;
  right: 18px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #1abc9c;
  color: #0f172a;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Watermark */
.watermark {
  position: absolute;
  top: 35%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 100px;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.12);
}

/* Chat Area */
.chat-area {
  position: absolute;
  top: 100px;
  left: 50%;
  transform: translateX(-50%);
  width: min(800px, 90%);
  height: calc(100vh - 220px);
  overflow-y: auto;
  display: none;
  flex-direction: column;
  gap: 15px;
}

/* Messages */
.message {
  max-width: 60%;
  padding: 12px 16px;
  border-radius: 18px;
}

.user {
  align-self: flex-end;
  background: rgba(255,255,255,0.8);
}

.bot {
  align-self: flex-start;
  background: rgba(0,0,0,0.3);
  color: white;
}

/* Prompt */
.prompt-container {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  width: min(90%, 700px);
  padding: 14px 18px;
  background: rgba(255, 255, 255, 0.22);
  backdrop-filter: blur(14px);
  border-radius: 50px;
}

.prompt-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-size: 16px;
  color: white;
}

.icon-btn, .send-btn {
  background: transparent;
  border: none;
  cursor: pointer;
}

.send-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: white;
}

/* Bottom Tools */
.bottom-tools {
  position: fixed;
  bottom: 18px;
  right: 18px;
  display: flex;
  gap: 18px;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(14px);
  border-radius: 50px;
}
</style>
</head>

<body>

<img src="https://logo-icons.com/cdn/shop/files/4765-logo-1739200822.556color-003932.svg?v=1739228536&width=416"
     class="glass-logo">

<!-- Auth Buttons -->
<div class="auth-buttons" id="authButtons">
  <button onclick="signIn()">Sign In</button>
  <button onclick="signUp()">Sign Up</button>
</div>

<!-- Profile -->
<div class="profile" id="profile">AB</div>

<!-- Watermark -->
<div class="watermark" id="watermark">Berry</div>

<!-- Chat Area -->
<div class="chat-area" id="chatArea"></div>

<!-- Prompt -->
<div class="prompt-container">
  <input type="file" id="imageInput" hidden>
  <button class="icon-btn" onclick="document.getElementById('imageInput').click()">
    <span class="material-icons">add</span>
  </button>

  <input type="text" id="promptInput" class="prompt-input"
         placeholder="Ask anything..." onkeydown="if(event.key==='Enter') sendMessage()">

  <button class="send-btn" onclick="sendMessage()">
    <span class="material-icons">send</span>
  </button>
</div>

<!-- Bottom Tools -->
<div class="bottom-tools">
  <button onclick="newChat()"><span class="material-icons">edit</span></button>
  <button><span class="material-icons">search</span></button>
  <button><span class="material-icons">image</span></button>
</div>

<script>

let chatStarted = false;
const chatArea = document.getElementById("chatArea");
const watermark = document.getElementById("watermark");

function startChatMode() {
  if (!chatStarted) {
    watermark.style.display = "none";
    chatArea.style.display = "flex";
    chatStarted = true;
  }
}

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.innerText = text;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById("promptInput");
  const text = input.value.trim();
  if (!text) return;

  startChatMode();
  addMessage(text, "user");
  input.value = "";

  const formData = new FormData();
  formData.append("prompt", text);

  const res = await fetch("/chat", {
    method: "POST",
    body: formData
  });

  const data = await res.json();
  addMessage(data.reply, "bot");
}

function newChat() {
  chatArea.innerHTML = "";
  watermark.style.display = "block";
  chatArea.style.display = "none";
  chatStarted = false;
}

function signIn() {
  alert("Sign In page coming next step.");
}

function signUp() {
  alert("Sign Up page coming next step.");
}

</script>

</body>
</html>
