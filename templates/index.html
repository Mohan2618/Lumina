<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Berry</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(45deg, #6a7bd1, #41e1ae);
  font-family: Arial;
  overflow: hidden;
}

/* Landing */
.landing {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

/* Chat Layout */
.chat-layout {
  display: none;
  height: 100%;
  display: flex;
  flex-direction: column;
}

.chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.message {
  max-width: 60%;
  padding: 12px 16px;
  border-radius: 18px;
}

.user {
  align-self: flex-end;
  background: #ffffffcc;
}

.bot {
  align-self: flex-start;
  background: #00000040;
  color: white;
}

.prompt-bar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: min(90%, 700px);
  display: flex;
  gap: 10px;
  padding: 12px;
  border-radius: 50px;
  backdrop-filter: blur(10px);
  background: rgba(255,255,255,0.2);
}

.prompt-bar input {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  color: white;
}
</style>
</head>

<body>

<!-- LANDING -->
<div class="landing" id="landing">
  <h1 style="color:white;opacity:0.2;font-size:80px;">Berry</h1>
</div>

<!-- CHAT MODE -->
<div class="chat-layout" id="chatLayout">
  <div class="chat-container" id="chat"></div>
</div>

<!-- PROMPT BAR (ALWAYS VISIBLE) -->
<div class="prompt-bar">
  <input type="file" id="imageInput" hidden>
  <button onclick="document.getElementById('imageInput').click()">
    <span class="material-icons">add</span>
  </button>

  <input id="promptInput" placeholder="Ask anything...">

  <button onclick="sendMessage()">
    <span class="material-icons">send</span>
  </button>
</div>

<script>

let chatStarted = false;
const chat = document.getElementById("chat");
const landing = document.getElementById("landing");
const chatLayout = document.getElementById("chatLayout");

function startChatMode() {
  if (!chatStarted) {
    landing.style.display = "none";
    chatLayout.style.display = "flex";
    chatStarted = true;
  }
}

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById("promptInput");
  const text = input.value.trim();
  if (!text) return;

  startChatMode();

  addMessage(text, "user");
  input.value = "";

  // Call backend
  const formData = new FormData();
  formData.append("prompt", text);

  const res = await fetch("/chat", {
    method: "POST",
    body: formData
  });

  const data = await res.json();
  addMessage(data.reply, "bot");
}

document.getElementById("imageInput").addEventListener("change", async function() {
  startChatMode();
});

</script>

</body>
</html>
