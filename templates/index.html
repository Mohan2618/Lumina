<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Berry</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(45deg, #6a7bd1, #41e1ae);
  font-family: Arial, sans-serif;
  position: relative;
  overflow: hidden;
}

/* Logo */
.glass-logo {
  position: fixed;
  top: 16px;
  left: 16px;
  width: 78px;
  filter:
    drop-shadow(0 6px 20px rgba(0, 0, 0, 0.35))
    drop-shadow(0 0 10px rgba(65, 225, 174, 0.6));
  cursor: pointer;
}

/* Auth Buttons */
.auth-buttons {
  position: fixed;
  top: 18px;
  right: 18px;
  display: flex;
  gap: 12px;
}

.auth-buttons button {
  padding: 8px 18px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
}

/* Profile */
.profile {
  position: fixed;
  top: 18px;
  right: 18px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #1abc9c;
  color: #0f172a;
  font-weight: bold;
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* Watermark */
.watermark {
  position: absolute;
  top: 35%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 100px;
  font-weight: 700;
  letter-spacing: 4px;
  color: rgba(255, 255, 255, 0.12);
}

#chatWrapper {
  position: absolute;
  top: 100px;
  left: 50%;
  transform: translateX(-50%);
  width: min(90%, 700px);
  height: 60vh;
  display: none;
}

#chatArea {
  width: 100%;
  height: 100%;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
  padding-right: 10px;
}

/* Chat bubbles */
.chat-msg {
  padding: 12px 16px;
  border-radius: 18px;
  max-width: 70%;
  word-wrap: break-word;
}

.user-msg {
  align-self: flex-end;
  background: rgba(255,255,255,0.85);
}

.bot-msg {
  align-self: flex-start;
  background: rgba(0,0,0,0.35);
  color: white;
}

/* Prompt Bar */
.prompt-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  
  flex-direction: column; /* IMPORTANT */
  width: min(90%, 700px);
  padding: 14px 18px;
  background: rgba(255, 255, 255, 0.22);
  backdrop-filter: blur(14px);
  border-radius: 50px;
}

  .prompt-container.dragover {
  border: 2px dashed white;
  background: rgba(255,255,255,0.3);
}

.prompt-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-size: 16px;
  color: white;
}

.prompt-input::placeholder {
  color: rgba(255,255,255,0.6);
}

.icon-btn {
  background: transparent;
  border: none;
  color: white;
  font-size: 26px;
  cursor: pointer;
}

.send-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.send-btn span {
  color: #6a7bd1;
}

/* Bottom Tools */
.bottom-tools {
  position: fixed;
  bottom: 18px;
  right: 18px;
  display: flex;
  gap: 18px;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(14px);
  border-radius: 50px;
}

.bottom-tools button {
  background: transparent;
  border: none;
  cursor: pointer;
  color: white;
  font-size: 24px;
}

/* Chat Mode Prompt Move */
.chat-mode .prompt-container {
  position: fixed;
  bottom: 20px;
  top: auto;
  left: 50%;
  transform: translateX(-50%);
}

  body.dragover-screen {
  outline: 4px dashed white;
}

  .typing {
  display: flex;
  gap: 4px;
}

.typing span {
  width: 8px;
  height: 8px;
  background: white;
  border-radius: 50%;
  animation: bounce 1.2s infinite;
}

.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }

@keyframes bounce {
  0%,80%,100% { transform: scale(0); }
  40% { transform: scale(1); }
}

  .chat-image-large {
  max-width: 500px;
  border-radius: 16px;
  margin-top: 6px;
}

</style>
</head>

<body>

<img src="https://logo-icons.com/cdn/shop/files/4765-logo-1739200822.556color-003932.svg?v=1739228536&width=416"
     alt="Berry Logo"
     class="glass-logo">

<!-- Auth -->
<div class="auth-buttons" id="authButtons">
  <button onclick="signIn()" title="Login to your account">Sign In</button>
<button onclick="signUp()" title="Create new account">Sign Up</button>
</div>

<div class="profile" id="profile" title="Profile Menu">AB</div>

  <div id="profileMenu" style="
  display:none;
  position:fixed;
  top:65px;
  right:18px;
  width:250px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(15px);
  border-radius:12px;
  padding:15px;
  color:white;
  z-index:1000;
">

  <div style="padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.2);">
    <strong id="profileName">User Name</strong><br>
    <span style="font-size:12px; opacity:0.7;">Free</span>
  </div>

  <div style="padding:10px 0; cursor:pointer;" onclick="openHelp()">
    <span class="material-icons" style="vertical-align:middle;">help_outline</span>
    Help
  </div>

  <div style="padding:10px 0; cursor:pointer;" onclick="openSettings()">
    <span class="material-icons" style="vertical-align:middle;">settings</span>
    Settings
  </div>

  <div style="padding:10px 0; cursor:pointer;" onclick="logout()">
    <span class="material-icons" style="vertical-align:middle;">logout</span>
    Log out
  </div>

</div>

<div class="watermark" id="watermark">Berry</div>

<div id="chatWrapper">
  <div id="chatArea"></div>
</div>

  <div id="historyPanel" style="
  display:none;
  position:fixed;
  right:0;
  top:0;
  width:300px;
  height:100%;
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(10px);
  padding:20px;
  overflow-y:auto;
  color:white;
  z-index:900;
">

  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h3>Chat History</h3>
    <span class="material-icons" 
          style="cursor:pointer;"
          onclick="closeHistory()">close</span>
  </div>

  <div id="historyList"></div>
</div>
  

<!-- Prompt -->
<div class="prompt-container">

  <!-- Attachment Row -->
  <div id="attachmentPreview"
       style="
         display:flex;
         gap:10px;
         margin-bottom:10px;
         flex-wrap:wrap;
       ">
  </div>

  <!-- Input Row -->
  <div style="display:flex; align-items:center; gap:12px;">

    <button class="icon-btn" onclick="uploadImage()" title="Attach File">
      <span class="material-icons">add</span>
    </button>

    <input
      type="text"
      class="prompt-input"
      id="promptInput"
      placeholder="Ask anything..."
      oninput="toggleIcon()"
      onkeydown="if(event.key==='Enter') sendMessage()"
    >

    <button class="icon-btn" onclick="micAction()" title="Voice Input">
      <span class="material-icons">mic</span>
    </button>

    <button class="send-btn" onclick="sendMessage()">
      <span class="material-icons" id="actionIcon">arrow_upward</span>
    </button>

  </div>

</div>

<div class="bottom-tools">
  <button onclick="newChat()" title="New Chat">
  <span class="material-icons">edit</span>
</button>
  <button onclick="openHistory()" title="Chat History">
  <span class="material-icons">search</span>
</button>
  <button onclick="uploadImage()" title="Upload Image">
  <span class="material-icons">image</span>
</button>
</div>

<script>

  document.addEventListener("DOMContentLoaded", function () {

  let chatStarted = false;
  let loggedIn = false;
  let currentChat = [];
  let allChats = JSON.parse(localStorage.getItem("berryChats")) || [];
  const MAX_FILE_SIZE = 5 * 1024 * 1024; // 5MB
  const ALLOWED_TYPES = ["image/jpeg", "image/png", "image/webp"];
  
  /* ================= TOOLTIP HANDLING ================= */
  // Already using title="" attributes (native browser tooltip)
  
  /* ================= ICON TOGGLE ================= */
  function toggleIcon() {
    const input = document.getElementById("promptInput");
    const icon = document.getElementById("actionIcon");
  
    if (input.value.trim() || attachedFiles.length > 0) {
      icon.textContent = "arrow_upward";
    } else {
      icon.textContent = "graphic_eq";
    }
  }
  
  /* ================= CHAT MODE ================= */
  function startChatMode() {
    if (!chatStarted) {
      document.body.classList.add("chat-mode");
      document.getElementById("watermark").style.display = "none";
      document.getElementById("chatWrapper").style.display = "block"; // FIXED
      chatStarted = true;
    }
  }
  
    function openHistory() {
    const panel = document.getElementById("historyPanel");
    panel.style.display = "block";
  
    const list = document.getElementById("historyList");
    list.innerHTML = "";
  
    const history = JSON.parse(localStorage.getItem("berryChats")) || [];
  
    if (history.length === 0) {
      list.innerHTML = "<p>No chats yet</p>";
      return;
    }
  
    history.forEach((chatHTML, index) => {
      const item = document.createElement("div");
      item.style.padding = "12px";
      item.style.marginBottom = "10px";
      item.style.background = "rgba(255,255,255,0.1)";
      item.style.borderRadius = "8px";
      item.style.cursor = "pointer";
  
      item.innerText = "Chat " + (index + 1);
  
      item.onclick = function() {
        document.getElementById("chatArea").innerHTML = chatHTML;
        startChatMode();
        closeHistory();
      };
  
      list.appendChild(item);
    });
  }
  
  
    function loadChat(index) {
    const chat = allChats[index];
    currentChat = chat;
  
    const chatArea = document.getElementById("chatArea");
    chatArea.innerHTML = "";
  
    chat.forEach(message => {
      const msgDiv = document.createElement("div");
      msgDiv.classList.add("chat-msg");
  
      if (message.role === "user") {
        msgDiv.classList.add("user-msg");
  
        if (message.image) {
          const img = document.createElement("img");
          img.src = message.image;
          img.style.maxWidth = "200px";
          img.style.borderRadius = "12px";
          msgDiv.appendChild(img);
        }
  
        const textDiv = document.createElement("div");
        textDiv.innerText = message.content;
        msgDiv.appendChild(textDiv);
  
      } else {
        msgDiv.classList.add("bot-msg");
        msgDiv.innerText = message.content;
      }
  
      chatArea.appendChild(msgDiv);
    });
  
    startChatMode();
  }
  
    function closeHistory() {
    document.getElementById("historyPanel").style.display = "none";
  }
  
  /* ================= ADD MESSAGE ================= */
  function addMessage(text, type) {
    const msg = document.createElement("div");
    msg.classList.add("chat-msg");
    msg.classList.add(type === "user" ? "user-msg" : "bot-msg");
    msg.innerText = text;
  
    const chat = document.getElementById("chatArea");
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
  }
  
  /* ================= SEND MESSAGE ================= */
 let generating = false;

async function sendMessage() {

  if (generating) return;

  generating = true;
  document.getElementById("actionIcon").textContent = "stop";
    const input = document.getElementById("promptInput");
    const text = input.value.trim();
  
    if (!text && attachedFiles.length === 0) return;
  
    startChatMode();
  
    const chatArea = document.getElementById("chatArea");
  
    // ======================
    // USER TEXT MESSAGE
    // ======================
    if (text) {
      const userTextDiv = document.createElement("div");
      userTextDiv.classList.add("chat-msg", "user-msg");
      userTextDiv.innerText = text;
      chatArea.appendChild(userTextDiv);
    }
  
    // ======================
    // USER IMAGE MESSAGE (Separate Bubble)
    // ======================
    if (attachedFiles.length > 0) {
      const userImgDiv = document.createElement("div");
      userImgDiv.classList.add("chat-msg", "user-msg");
  
      const img = document.createElement("img");
      img.src = attachedFiles[0];
      img.classList.add("chat-image-large");
  
      userImgDiv.appendChild(img);
      chatArea.appendChild(userImgDiv);
    }
  
    chatArea.scrollTop = chatArea.scrollHeight;
  
    // ======================
    // PREPARE FORM DATA
    // ======================
    const formData = new FormData();
    formData.append("prompt", text);
  
    if (attachedFiles.length > 0) {
      const blob = await fetch(attachedFiles[0]).then(r => r.blob());
      formData.append("image", blob, "upload.jpg");
    }
  
    input.value = "";
    attachedFiles = [];
    renderAttachmentPreview();
  
    showTyping();
  
    // ======================
    // CALL BACKEND
    // ======================
    const response = await fetch("/process", {
      method: "POST",
      body: formData
    });
  
   if (!response.ok) {
    const text = await response.text();
    removeTyping();
    alert("Server error:\n" + text);
    return;
}

const data = await response.json();
  
    removeTyping();
    generating = false;
    document.getElementById("actionIcon").textContent = "arrow_upward";
  
    // ======================
    // BOT TEXT RESPONSE
    // ======================
    if (data.message) {
      const botText = document.createElement("div");
      botText.classList.add("chat-msg", "bot-msg");
      botText.innerHTML = data.message
  .replace(/```python/g, "<pre><code>")
  .replace(/```/g, "</code></pre>")
  .replace(/\n/g, "<br>");
      chatArea.appendChild(botText);
    }
  
    // ======================
    // BOT IMAGE RESPONSE
    // ======================
    if (data.image) {
      const botImgDiv = document.createElement("div");
      botImgDiv.classList.add("chat-msg", "bot-msg");
  
      const botImg = document.createElement("img");
      botImg.src = data.image;
      botImg.classList.add("chat-image-large");
  
      botImgDiv.appendChild(botImg);
      chatArea.appendChild(botImgDiv);
    }
  
    chatArea.scrollTop = chatArea.scrollHeight;
  
    saveChatHistory();
  }
  
    function saveChatHistory() {
    const chatArea = document.getElementById("chatArea").innerHTML;
  
    let history = JSON.parse(localStorage.getItem("berryChats")) || [];
  
    history.push(chatArea);
  
    localStorage.setItem("berryChats", JSON.stringify(history));
  }
  
  /* ================= NEW CHAT ================= */
  function newChat() {
    document.getElementById("chatArea").innerHTML = "";
    document.body.classList.remove("chat-mode");
    document.getElementById("watermark").style.display = "block";
    document.getElementById("chatWrapper").style.display = "none";
    chatStarted = false;
  }
  
  /* ================= SEARCH CHAT ================= */
  function searchChat() {
    const keyword = prompt("Search in chat:");
    if (!keyword) return;
  
    const messages = document.querySelectorAll(".chat-msg");
    messages.forEach(msg => {
      if (msg.innerText.toLowerCase().includes(keyword.toLowerCase())) {
        msg.style.border = "2px solid yellow";
      } else {
        msg.style.border = "none";
      }
    });
  }
  
  /* ================= IMAGE UPLOAD ================= */
  let attachedFiles = [];
  
  function uploadImage() {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.multiple = true;
  
    input.onchange = e => {
      const files = Array.from(e.target.files);
      if (!files.length) return;
  
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(event) {
          attachedFiles.push(event.target.result);
          renderAttachmentPreview();
          toggleIcon(); // switch to send mode
        };
        reader.readAsDataURL(file);
      });
    };
  
    input.click();
  }
  
    const promptBox = document.querySelector(".prompt-container");
  
  /* ================= GLOBAL DRAG & DROP ================= */
  
  document.addEventListener("dragover", (e) => {
    e.preventDefault();
    document.body.classList.add("dragover-screen");
  });
  
  document.addEventListener("dragleave", (e) => {
    e.preventDefault();
    document.body.classList.remove("dragover-screen");
  });
  
  document.addEventListener("drop", (e) => {
    e.preventDefault();
    document.body.classList.remove("dragover-screen");
  
    const files = Array.from(e.dataTransfer.files);
    handleFiles(files);
  });
  
    function renderAttachmentPreview() {
    const preview = document.getElementById("attachmentPreview");
    preview.innerHTML = "";
  
    attachedFiles.forEach((file, index) => {
  
      const wrapper = document.createElement("div");
      wrapper.style.position = "relative";
  
      const img = document.createElement("img");
      img.src = file;
      img.onclick = () => openImageModal(file);
      img.style.height = "60px";
      img.style.borderRadius = "8px";
  
      const removeBtn = document.createElement("span");
      removeBtn.innerHTML = "×";
      removeBtn.style.position = "absolute";
      removeBtn.style.top = "-6px";
      removeBtn.style.right = "-6px";
      removeBtn.style.background = "white";
      removeBtn.style.borderRadius = "50%";
      removeBtn.style.cursor = "pointer";
      removeBtn.style.padding = "2px 6px";
      removeBtn.onclick = () => {
        attachedFiles.splice(index, 1);
        renderAttachmentPreview();
        toggleIcon();
      };
  
      wrapper.appendChild(img);
      wrapper.appendChild(removeBtn);
      preview.appendChild(wrapper);
    });
  }
  
  /* ================= MIC SIMULATION ================= */
  function micAction() {
    alert("Voice input feature coming soon 🎤");
  }
  
  /* ================= AUTH SYSTEM ================= */
  
  let authMode = "signin";
  
  function signIn() {
    authMode = "signin";
    document.getElementById("authTitle").innerText = "Sign In";
    document.getElementById("signupFields").style.display = "none";
    document.getElementById("loginIdentifier").style.display = "block";
    document.getElementById("authModal").style.display = "flex";
    document.querySelector("button[onclick='forgotPassword()']").style.display = "block";
  }
  
  function signUp() {
    authMode = "signup";
    document.getElementById("authTitle").innerText = "Sign Up";
    document.getElementById("signupFields").style.display = "flex";
    document.getElementById("loginIdentifier").style.display = "none";
    document.getElementById("authModal").style.display = "flex";
    document.querySelector("button[onclick='forgotPassword()']").style.display = "none";
  }
  
  function closeAuth() {
    document.getElementById("authModal").style.display = "none";
  }
  
  function submitAuth() {
    const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
  
    if (authMode === "signup") {
  
      if (!firstName.value ||
          !lastName.value ||
          !dob.value ||
          !email.value ||
          !username.value ||
          !password.value) {
        alert("All fields are required.");
        return;
      }
  
      if (!emailPattern.test(email.value)) {
        alert("Enter valid email.");
        return;
      }
  
      if (password.value.length < 6) {
        alert("Password must be at least 6 characters.");
        return;
      }
  
      const user = {
        firstName: firstName.value,
        lastName: lastName.value,
        dob: dob.value,
        email: email.value,
        username: username.value,
        password: password.value
      };
  
      localStorage.setItem("berryUser", JSON.stringify(user));
      alert("Account created successfully!");
      closeAuth();
      return;
    }
  
    // SIGN IN
    const stored = JSON.parse(localStorage.getItem("berryUser"));
    const identifier = loginIdentifier.value;
  
    if (!identifier || !password.value) {
      alert("Enter credentials.");
      return;
    }
  
    if (!stored) {
      alert("No account found.");
      return;
    }
  
    if ((stored.email === identifier || stored.username === identifier)
        && stored.password === password.value) {
  
      document.getElementById("authButtons").style.display = "none";
      document.getElementById("profile").style.display = "flex";
      document.getElementById("profile").innerText =
        stored.firstName.charAt(0).toUpperCase();
      document.getElementById("profileName").innerText =
        stored.firstName + " " + stored.lastName;
  
      closeAuth();
    } else {
      alert("Invalid credentials.");
    }
  }
  
  function forgotPassword() {
    const stored = JSON.parse(localStorage.getItem("berryUser"));
    if (!stored) {
      alert("No account found.");
      return;
    }
  
    alert("Password is: " + stored.password);
  }
  
  /* ================= PROFILE DROPDOWN ================= */
  document.getElementById("profile").onclick = function(e) {
    e.stopPropagation();
    const menu = document.getElementById("profileMenu");
    menu.style.display =
      menu.style.display === "block" ? "none" : "block";
  };
  
    document.addEventListener("click", function() {
    document.getElementById("profileMenu").style.display = "none";
  });
  
    function logout() {
    document.getElementById("authButtons").style.display = "flex";
    document.getElementById("profile").style.display = "none";
  }
  
    function openHelp() {
    alert("Help section coming soon.");
  }
  
  function openSettings() {
    alert("Settings panel coming soon.");
  }
  
    function handleFiles(files) {
    files.forEach(file => {
  
      if (!ALLOWED_TYPES.includes(file.type)) {
        alert("Only JPG, PNG, WEBP allowed.");
        return;
      }
  
      if (file.size > MAX_FILE_SIZE) {
        alert("File exceeds 5MB limit.");
        return;
      }
  
      const reader = new FileReader();
      reader.onload = function(e) {
        attachedFiles.push(e.target.result);
        renderAttachmentPreview();
        toggleIcon();
      };
      reader.readAsDataURL(file);
    });
  }
  
  
    function openImageModal(src) {
    document.getElementById("modalImage").src = src;
    document.getElementById("imageModal").style.display = "flex";
  }
  
  document.getElementById("imageModal").onclick = function() {
    this.style.display = "none";
  };
  
    function showTyping() {
    const typing = document.createElement("div");
    typing.classList.add("chat-msg", "bot-msg");
    typing.id = "typingIndicator";
    typing.innerHTML = `
      <div class="typing">
        <span></span><span></span><span></span>
      </div>
    `;
    document.getElementById("chatArea").appendChild(typing);
  }
  
    function removeTyping() {
    const typing = document.getElementById("typingIndicator");
    if (typing) typing.remove();
  }


    /* ===== EXPOSE FUNCTIONS TO GLOBAL ===== */
window.sendMessage = sendMessage;
window.uploadImage = uploadImage;
window.newChat = newChat;
window.openHistory = openHistory;
window.toggleIcon = toggleIcon;
window.micAction = micAction;
window.signIn = signIn;
window.signUp = signUp;
window.submitAuth = submitAuth;
window.closeAuth = closeAuth;
window.forgotPassword = forgotPassword;
window.logout = logout;
window.openHelp = openHelp;
window.openSettings = openSettings;
});

</script>

  <div id="authModal" style="
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  backdrop-filter:blur(10px);
  justify-content:center;
  align-items:center;
  z-index:1000;
">

  <div style="
    width:400px;
    max-height:80vh;
    overflow-y:auto;
    padding:30px;
    background:rgba(255,255,255,0.18);
    border-radius:20px;
    backdrop-filter:blur(15px);
    display:flex;
    flex-direction:column;
    gap:12px;
  ">

    <h3 id="authTitle" style="color:white;text-align:center;">Sign In</h3>

    <div id="signupFields" style="display:none; flex-direction:column; gap:10px;">
      <input id="firstName" placeholder="First Name" style="padding:10px;border-radius:8px;border:none;">
      <input id="lastName" placeholder="Last Name" style="padding:10px;border-radius:8px;border:none;">
      <input id="dob" type="date" style="padding:10px;border-radius:8px;border:none;">
      <input id="email" placeholder="Email" style="padding:10px;border-radius:8px;border:none;">
      <input id="username" placeholder="Username" style="padding:10px;border-radius:8px;border:none;">
    </div>

    <input id="loginIdentifier" placeholder="Email or Username" style="padding:10px;border-radius:8px;border:none;">
    <input id="password" type="password" placeholder="Password" style="padding:10px;border-radius:8px;border:none;">

    <button onclick="submitAuth()" style="
      padding:10px;
      border-radius:8px;
      border:none;
      cursor:pointer;
    ">Submit</button>

    <button onclick="forgotPassword()" style="
      background:none;
      border:none;
      color:white;
      cursor:pointer;
      text-decoration:underline;
    ">Forgot Password?</button>

    <button onclick="closeAuth()" style="
      background:none;
      border:none;
      color:white;
      cursor:pointer;
    ">Cancel</button>

  </div>
</div>


  <div id="imageModal" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
z-index:2000;
">
  <img id="modalImage" style="max-width:90%; max-height:90%;">
</div>

</body>
</html>
