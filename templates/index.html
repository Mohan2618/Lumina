<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Berry</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(45deg, #6a7bd1, #41e1ae);
  font-family: Arial, sans-serif;
  position: relative;
  overflow: hidden;
}

/* Logo */
.glass-logo {
  position: fixed;
  top: 16px;
  left: 16px;
  width: 78px;
  filter:
    drop-shadow(0 6px 20px rgba(0, 0, 0, 0.35))
    drop-shadow(0 0 10px rgba(65, 225, 174, 0.6));
  cursor: pointer;
}

/* Auth Buttons */
.auth-buttons {
  position: fixed;
  top: 18px;
  right: 18px;
  display: flex;
  gap: 12px;
}

.auth-buttons button {
  padding: 8px 18px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
}

/* Profile */
.profile {
  position: fixed;
  top: 18px;
  right: 18px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #1abc9c;
  color: #0f172a;
  font-weight: bold;
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* Watermark */
.watermark {
  position: absolute;
  top: 35%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 100px;
  font-weight: 700;
  letter-spacing: 4px;
  color: rgba(255, 255, 255, 0.12);
}

#chatWrapper {
  position: absolute;
  top: 100px;
  left: 50%;
  transform: translateX(-50%);
  width: min(90%, 700px);
  height: 60vh;
  display: none;
}

#chatArea {
  width: 100%;
  height: 100%;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
  padding-right: 10px;
}

/* Chat bubbles */
.chat-msg {
  padding: 12px 16px;
  border-radius: 18px;
  max-width: 70%;
  word-wrap: break-word;
}

.user-msg {
  align-self: flex-end;
  background: rgba(255,255,255,0.85);
}

.bot-msg {
  align-self: flex-start;
  background: rgba(0,0,0,0.35);
  color: white;
}

/* Prompt Bar */
.prompt-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(90%, 700px);
  padding: 14px 18px;
  background: rgba(255, 255, 255, 0.22);
  backdrop-filter: blur(14px);
  border-radius: 50px;
}

.prompt-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-size: 16px;
  color: white;
}

.prompt-input::placeholder {
  color: rgba(255,255,255,0.6);
}

.icon-btn {
  background: transparent;
  border: none;
  color: white;
  font-size: 26px;
  cursor: pointer;
}

.send-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.send-btn span {
  color: #6a7bd1;
}

/* Bottom Tools */
.bottom-tools {
  position: fixed;
  bottom: 18px;
  right: 18px;
  display: flex;
  gap: 18px;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(14px);
  border-radius: 50px;
}

.bottom-tools button {
  background: transparent;
  border: none;
  cursor: pointer;
  color: white;
  font-size: 24px;
}

/* Chat Mode Prompt Move */
.chat-mode .prompt-container {
  position: fixed;
  bottom: 20px;
  top: auto;
  left: 50%;
  transform: translateX(-50%);
}
</style>
</head>

<body>

<img src="https://logo-icons.com/cdn/shop/files/4765-logo-1739200822.556color-003932.svg?v=1739228536&width=416"
     alt="Berry Logo"
     class="glass-logo">

<!-- Auth -->
<div class="auth-buttons" id="authButtons">
  <button onclick="signIn()" title="Login to your account">Sign In</button>
<button onclick="signUp()" title="Create new account">Sign Up</button>
</div>

<div class="profile" id="profile" title="Profile Menu">AB</div>

<div class="watermark" id="watermark">Berry</div>

<div id="chatWrapper">
  <div id="chatArea"></div>
</div>

  <div id="historyPanel" style="
  display:none;
  position:fixed;
  right:0;
  top:0;
  width:300px;
  height:100%;
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(10px);
  padding:20px;
  overflow-y:auto;
  color:white;
  z-index:900;
">
  <h3>Chat History</h3>
  <div id="historyList"></div>
</div>

<!-- Prompt -->
<div class="prompt-container">
  <button class="icon-btn" onclick="uploadImage()" title="Attach File">
  <span class="material-icons">add</span>
</button>

  <div id="attachmentPreview" style="display:flex; gap:10px;"></div>

  <input
    type="text"
    class="prompt-input"
    id="promptInput"
    placeholder="Ask anything..."
    oninput="toggleIcon()"
    onkeydown="if(event.key==='Enter') sendMessage()"
  >

  <button class="icon-btn" onclick="micAction()" title="Voice Input">
  <span class="material-icons">mic</span>
</button>

  <button class="send-btn" onclick="sendMessage()">
    <span class="material-icons" id="actionIcon">graphic_eq</span>
  </button>
</div>

<div class="bottom-tools">
  <button onclick="newChat()" title="New Chat">
  <span class="material-icons">edit</span>
</button>
  <button onclick="openHistory()" title="Chat History">
  <span class="material-icons">search</span>
</button>
  <button onclick="uploadImage()" title="Upload Image">
  <span class="material-icons">image</span>
</button>
</div>

<script>

let chatStarted = false;
let loggedIn = false;

/* ================= TOOLTIP HANDLING ================= */
// Already using title="" attributes (native browser tooltip)

/* ================= ICON TOGGLE ================= */
function toggleIcon() {
  const input = document.getElementById("promptInput");
  const icon = document.getElementById("actionIcon");

  if (input.value.trim().length > 0) {
    icon.textContent = "send";
  } else {
    icon.textContent = "graphic_eq";
  }
}

/* ================= CHAT MODE ================= */
function startChatMode() {
  if (!chatStarted) {
    document.body.classList.add("chat-mode");
    document.getElementById("watermark").style.display = "none";
    document.getElementById("chatArea").style.display = "flex";
    chatStarted = true;
  }
}

  function openHistory() {
  const panel = document.getElementById("historyPanel");

  panel.style.display =
    panel.style.display === "block" ? "none" : "block";

  const history = JSON.parse(localStorage.getItem("berryChats")) || [];
  const list = document.getElementById("historyList");

  list.innerHTML = "";

  if (history.length === 0) {
    list.innerHTML = "<p>No previous chats</p>";
    return;
  }

  history.forEach((chat, index) => {
    const item = document.createElement("div");
    item.style.padding = "10px";
    item.style.cursor = "pointer";
    item.style.marginBottom = "10px";
    item.style.background = "rgba(255,255,255,0.1)";
    item.style.borderRadius = "8px";

    item.innerText = "Chat " + (index + 1);

    item.onclick = function() {
      document.getElementById("chatArea").innerHTML = chat;
      panel.style.display = "none";
      startChatMode();
    };

    list.appendChild(item);
  });
}

/* ================= ADD MESSAGE ================= */
function addMessage(text, type) {
  const msg = document.createElement("div");
  msg.classList.add("chat-msg");
  msg.classList.add(type === "user" ? "user-msg" : "bot-msg");
  msg.innerText = text;

  const chat = document.getElementById("chatArea");
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

/* ================= SEND MESSAGE ================= */
function sendMessage() {
  const input = document.getElementById("promptInput");
  const text = input.value.trim();

  if (!text && !attachedImage) return;

  startChatMode();

  const container = document.createElement("div");
  container.classList.add("chat-msg", "user-msg");

  if (attachedImage) {
    const img = document.createElement("img");
    img.src = attachedImage;
    img.style.maxWidth = "200px";
    img.style.borderRadius = "12px";
    container.appendChild(img);
  }

  if (text) {
    const msgText = document.createElement("div");
    msgText.innerText = text;
    container.appendChild(msgText);
  }

  document.getElementById("chatArea").appendChild(container);

  input.value = "";
  attachedImage = null;
  document.getElementById("attachmentPreview").innerHTML = "";

  toggleIcon();

  setTimeout(() => {
    addMessage("AI response for your input.", "bot");
    saveChatHistory();
  }, 400);
}

  function saveChatHistory() {
  const chatHTML = document.getElementById("chatArea").innerHTML;

  let history = JSON.parse(localStorage.getItem("berryChats")) || [];

  // Avoid duplicate saves
  if (history.length === 0 || history[history.length - 1] !== chatHTML) {
    history.push(chatHTML);
    localStorage.setItem("berryChats", JSON.stringify(history));
  }
}

/* ================= NEW CHAT ================= */
function newChat() {
  document.getElementById("chatArea").innerHTML = "";
  document.body.classList.remove("chat-mode");
  document.getElementById("watermark").style.display = "block";
  document.getElementById("chatArea").style.display = "none";
  chatStarted = false;
}

/* ================= SEARCH CHAT ================= */
function searchChat() {
  const keyword = prompt("Search in chat:");
  if (!keyword) return;

  const messages = document.querySelectorAll(".chat-msg");
  messages.forEach(msg => {
    if (msg.innerText.toLowerCase().includes(keyword.toLowerCase())) {
      msg.style.border = "2px solid yellow";
    } else {
      msg.style.border = "none";
    }
  });
}

/* ================= IMAGE UPLOAD ================= */
let attachedImage = null;

function uploadImage() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";

  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {

      attachedImage = event.target.result;

      const preview = document.getElementById("attachmentPreview");
      preview.innerHTML = "";

      const img = document.createElement("img");
      img.src = attachedImage;
      img.style.height = "40px";
      img.style.borderRadius = "8px";

      preview.appendChild(img);
    };
    reader.readAsDataURL(file);
  };

  input.click();
}

/* ================= MIC SIMULATION ================= */
function micAction() {
  alert("Voice input feature coming soon 🎤");
}

/* ================= AUTH SYSTEM ================= */

let authMode = "signin";

function signIn() {
  authMode = "signin";
  document.getElementById("authTitle").innerText = "Sign In";
  document.getElementById("signupFields").style.display = "none";
  document.getElementById("loginIdentifier").style.display = "block";
  document.getElementById("authModal").style.display = "flex";
}

function signUp() {
  authMode = "signup";
  document.getElementById("authTitle").innerText = "Sign Up";
  document.getElementById("signupFields").style.display = "flex";
  document.getElementById("loginIdentifier").style.display = "none";
  document.getElementById("authModal").style.display = "flex";
}

function closeAuth() {
  document.getElementById("authModal").style.display = "none";
}

function submitAuth() {

  if (authMode === "signup") {

    const user = {
      firstName: firstName.value,
      lastName: lastName.value,
      dob: dob.value,
      email: email.value,
      username: username.value,
      password: password.value
    };

    if (!user.email || !user.password || !user.username) {
      alert("Fill required fields");
      return;
    }

    localStorage.setItem("berryUser", JSON.stringify(user));
    alert("Account created!");
    closeAuth();
    return;
  }

  // Sign In
  const stored = JSON.parse(localStorage.getItem("berryUser"));
  const identifier = loginIdentifier.value;

  if (!stored) {
    alert("No user found.");
    return;
  }

  if ((stored.email === identifier || stored.username === identifier)
      && stored.password === password.value) {

    document.getElementById("authButtons").style.display = "none";
    document.getElementById("profile").style.display = "flex";
    document.getElementById("profile").innerText = stored.firstName.charAt(0);
    closeAuth();
  } else {
    alert("Invalid credentials");
  }
}

function forgotPassword() {
  const stored = JSON.parse(localStorage.getItem("berryUser"));
  if (!stored) {
    alert("No account found.");
    return;
  }

  alert("Password is: " + stored.password);
}

/* ================= PROFILE DROPDOWN ================= */
document.getElementById("profile").onclick = function() {
  const action = confirm("Press OK to Logout");
  if (action) logout();
};

  function logout() {
  document.getElementById("authButtons").style.display = "flex";
  document.getElementById("profile").style.display = "none";
}

</script>

  <div id="authModal" style="
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  backdrop-filter:blur(10px);
  justify-content:center;
  align-items:center;
  z-index:1000;
">

  <div style="
    width:400px;
    max-height:80vh;
    overflow-y:auto;
    padding:30px;
    background:rgba(255,255,255,0.18);
    border-radius:20px;
    backdrop-filter:blur(15px);
    display:flex;
    flex-direction:column;
    gap:12px;
  ">

    <h3 id="authTitle" style="color:white;text-align:center;">Sign In</h3>

    <div id="signupFields" style="display:none; flex-direction:column; gap:10px;">
      <input id="firstName" placeholder="First Name" style="padding:10px;border-radius:8px;border:none;">
      <input id="lastName" placeholder="Last Name" style="padding:10px;border-radius:8px;border:none;">
      <input id="dob" type="date" style="padding:10px;border-radius:8px;border:none;">
      <input id="email" placeholder="Email" style="padding:10px;border-radius:8px;border:none;">
      <input id="username" placeholder="Username" style="padding:10px;border-radius:8px;border:none;">
    </div>

    <input id="loginIdentifier" placeholder="Email or Username" style="padding:10px;border-radius:8px;border:none;">
    <input id="password" type="password" placeholder="Password" style="padding:10px;border-radius:8px;border:none;">

    <button onclick="submitAuth()" style="
      padding:10px;
      border-radius:8px;
      border:none;
      cursor:pointer;
    ">Submit</button>

    <button onclick="forgotPassword()" style="
      background:none;
      border:none;
      color:white;
      cursor:pointer;
      text-decoration:underline;
    ">Forgot Password?</button>

    <button onclick="closeAuth()" style="
      background:none;
      border:none;
      color:white;
      cursor:pointer;
    ">Cancel</button>

  </div>
</div>

</body>
</html>
