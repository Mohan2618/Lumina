<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Berry</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(45deg, #6a7bd1, #41e1ae);
    font-family: Arial, sans-serif;
    position: relative;
    overflow: hidden;
  }

.glass-logo {
  position: fixed;
  top: 16px;
  left: 16px;
  width: 78px;
  height: auto;
  filter:
    drop-shadow(0 6px 20px rgba(0, 0, 0, 0.35))
    drop-shadow(0 0 10px rgba(65, 225, 174, 0.6));
  opacity: 0.95;
  cursor: pointer;
  transition: transform 0.25s ease, filter 0.25s ease;
}
.glass-logo:hover {
  transform: scale(1.08);
  filter:
    drop-shadow(0 10px 30px rgba(0, 0, 0, 0.45))
    drop-shadow(0 0 14px rgba(65, 225, 174, 0.9));
}

.profile {
  position: fixed;
  top: 18px;
  right: 18px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #1abc9c;
  color: #0f172a;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.watermark {
  position: absolute;
  top: 35%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 100px;
  font-weight: 700;
  letter-spacing: 4px;
  color: rgba(255, 255, 255, 0.12);
  user-select: none;
}

.prompt-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(90%, 700px);
  padding: 14px 18px;
  background: rgba(255, 255, 255, 0.22);
  backdrop-filter: blur(14px);
  border-radius: 50px;
}

.prompt-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-size: 16px;
  color: white;
}

.prompt-input::placeholder {
  color: rgba(255,255,255,0.6);
}

.icon-btn {
  background: transparent;
  border: none;
  color: white;
  font-size: 26px;
  cursor: pointer;
}

.send-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.send-btn span {
  color: #6a7bd1;
}

.bottom-tools {
  position: fixed;
  bottom: 18px;
  right: 18px;
  display: flex;
  gap: 18px;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(14px);
  border-radius: 50px;
}

.bottom-tools button {
  background: transparent;
  border: none;
  cursor: pointer;
  color: white;
  font-size: 24px;
  transition: transform 0.2s;
}

.bottom-tools button:hover {
  transform: scale(1.15);
}

/* Output image */
#resultImage {
  position: fixed;
  bottom: 120px;
  right: 40px;
  width: 320px;
  border-radius: 20px;
  display: none;
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}
</style>
</head>

<body>

<img src="https://logo-icons.com/cdn/shop/files/4765-logo-1739200822.556color-003932.svg?v=1739228536&width=416"
     alt="Berry Logo"
     class="glass-logo">

<div class="profile">AB</div>
<div class="watermark">Berry</div>

<img id="resultImage">

<div class="prompt-container">

  <!-- Hidden image upload -->
  <input type="file" id="imageUpload" accept="image/*" style="display:none">

  <!-- + icon -->
  <button class="icon-btn"
          onclick="document.getElementById('imageUpload').click()">
    <span class="material-icons">add</span>
  </button>

  <!-- Prompt -->
  <input
    type="text"
    class="prompt-input"
    id="promptInput"
    placeholder="Ask anything..."
    oninput="toggleIcon()"
  >

  <!-- Mic (visual only for now) -->
  <button class="icon-btn">
    <span class="material-icons">mic</span>
  </button>

  <!-- Send -->
  <button class="send-btn" onclick="sendPrompt()">
    <span class="material-icons" id="actionIcon">graphic_eq</span>
  </button>

</div>

<div class="bottom-tools">
  <button><span class="material-icons">edit</span></button>
  <button><span class="material-icons">search</span></button>
  <button><span class="material-icons">image</span></button>
</div>

<script>
function toggleIcon() {
  const input = document.getElementById("promptInput");
  const icon = document.getElementById("actionIcon");
  icon.textContent = input.value.trim() ? "send" : "graphic_eq";
}

async function sendPrompt() {

  const prompt = document.getElementById("promptInput").value;
  const imageFile = document.getElementById("imageUpload").files[0];

  if (!imageFile) {
    alert("Please upload an image first using + icon.");
    return;
  }

  const formData = new FormData();
  formData.append("prompt", prompt);
  formData.append("image", imageFile);

  const response = await fetch("/process", {
    method: "POST",
    body: formData
  });

  const result = await response.json();

  if (result.image) {
    const img = document.getElementById("resultImage");
    img.src = result.image + "?t=" + new Date().getTime();
    img.style.display = "block";
  }
  else if (result.message) {
    alert(result.message);
  }
}
</script>

</body>
</html>
