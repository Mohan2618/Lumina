<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Berry</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(45deg, #6a7bd1, #41e1ae);
  font-family: Arial, sans-serif;
  position: relative;
  overflow: hidden;
}

/* Logo */
.glass-logo {
  position: fixed;
  top: 16px;
  left: 16px;
  width: 78px;
  filter:
    drop-shadow(0 6px 20px rgba(0, 0, 0, 0.35))
    drop-shadow(0 0 10px rgba(65, 225, 174, 0.6));
  cursor: pointer;
}

/* Auth Buttons */
.auth-buttons {
  position: fixed;
  top: 18px;
  right: 18px;
  display: flex;
  gap: 12px;
}

.auth-buttons button {
  padding: 8px 18px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
}

/* Profile */
.profile {
  position: fixed;
  top: 18px;
  right: 18px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #1abc9c;
  color: #0f172a;
  font-weight: bold;
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* Watermark */
.watermark {
  position: absolute;
  top: 35%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 100px;
  font-weight: 700;
  letter-spacing: 4px;
  color: rgba(255, 255, 255, 0.12);
}

/* Chat Area */
#chatArea {
  position: absolute;
  top: 100px;
  left: 50%;
  transform: translateX(-50%);
  width: min(90%, 700px);
  max-height: 65vh;
  overflow-y: auto;
  display: none;
  flex-direction: column;
  gap: 15px;
}

/* Chat bubbles */
.chat-msg {
  padding: 12px 16px;
  border-radius: 18px;
  max-width: 70%;
  word-wrap: break-word;
}

.user-msg {
  align-self: flex-end;
  background: rgba(255,255,255,0.85);
}

.bot-msg {
  align-self: flex-start;
  background: rgba(0,0,0,0.35);
  color: white;
}

/* Prompt Bar */
.prompt-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(90%, 700px);
  padding: 14px 18px;
  background: rgba(255, 255, 255, 0.22);
  backdrop-filter: blur(14px);
  border-radius: 50px;
}

.prompt-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-size: 16px;
  color: white;
}

.prompt-input::placeholder {
  color: rgba(255,255,255,0.6);
}

.icon-btn {
  background: transparent;
  border: none;
  color: white;
  font-size: 26px;
  cursor: pointer;
}

.send-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.send-btn span {
  color: #6a7bd1;
}

/* Bottom Tools */
.bottom-tools {
  position: fixed;
  bottom: 18px;
  right: 18px;
  display: flex;
  gap: 18px;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(14px);
  border-radius: 50px;
}

.bottom-tools button {
  background: transparent;
  border: none;
  cursor: pointer;
  color: white;
  font-size: 24px;
}

/* Chat Mode Prompt Move */
.chat-mode .prompt-container {
  position: fixed;
  bottom: 20px;
  top: auto;
  left: 50%;
  transform: translateX(-50%);
}
</style>
</head>

<body>

<img src="https://logo-icons.com/cdn/shop/files/4765-logo-1739200822.556color-003932.svg?v=1739228536&width=416"
     alt="Berry Logo"
     class="glass-logo">

<!-- Auth -->
<div class="auth-buttons" id="authButtons">
  <button onclick="signIn()">Sign In</button>
  <button onclick="signUp()">Sign Up</button>
</div>

<div class="profile" id="profile">AB</div>

<div class="watermark" id="watermark">Berry</div>

<div id="chatArea"></div>

<!-- Prompt -->
<div class="prompt-container">
  <button class="icon-btn"><span class="material-icons">add</span></button>

  <input
    type="text"
    class="prompt-input"
    id="promptInput"
    placeholder="Ask anything..."
    oninput="toggleIcon()"
    onkeydown="if(event.key==='Enter') sendMessage()"
  >

  <button class="icon-btn"><span class="material-icons">mic</span></button>

  <button class="send-btn" onclick="sendMessage()">
    <span class="material-icons" id="actionIcon">graphic_eq</span>
  </button>
</div>

<div class="bottom-tools">
  <button onclick="newChat()"><span class="material-icons">edit</span></button>
  <button><span class="material-icons">search</span></button>
  <button><span class="material-icons">image</span></button>
</div>

<script>
let chatStarted = false;
let loggedIn = false;

function toggleIcon() {
  const input = document.getElementById("promptInput");
  const icon = document.getElementById("actionIcon");
  icon.textContent = input.value.trim() ? "send" : "graphic_eq";
}

function startChatMode() {
  if (!chatStarted) {
    document.body.classList.add("chat-mode");
    document.getElementById("watermark").style.display = "none";
    document.getElementById("chatArea").style.display = "flex";
    chatStarted = true;
  }
}

function addMessage(text, type) {
  const msg = document.createElement("div");
  msg.classList.add("chat-msg");
  msg.classList.add(type === "user" ? "user-msg" : "bot-msg");
  msg.innerText = text;
  const chat = document.getElementById("chatArea");
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById("promptInput");
  const text = input.value.trim();
  if (!text) return;

  startChatMode();
  addMessage(text, "user");
  input.value = "";
  toggleIcon();

  // Dummy response (replace with backend API)
  setTimeout(() => {
    addMessage("This is a sample AI response.", "bot");
  }, 500);
}

function newChat() {
  document.getElementById("chatArea").innerHTML = "";
  document.body.classList.remove("chat-mode");
  document.getElementById("watermark").style.display = "block";
  document.getElementById("chatArea").style.display = "none";
  chatStarted = false;
}

function signIn() {
  loggedIn = true;
  document.getElementById("authButtons").style.display = "none";
  document.getElementById("profile").style.display = "flex";
}

function signUp() {
  signIn();
}
</script>

</body>
</html>
