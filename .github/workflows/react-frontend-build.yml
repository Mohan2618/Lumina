name: React frontend build

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/react-frontend-build.yml"
  push:
    branches:
      - feature/react-frontend-migration
    paths:
      - "frontend/**"
      - ".github/workflows/react-frontend-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build React frontend
        run: npm run build
