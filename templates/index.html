<body>

<img src="https://logo-icons.com/cdn/shop/files/4765-logo-1739200822.556color-003932.svg?v=1739228536&width=416"
     alt="Berry Logo"
     class="glass-logo">

<!-- AUTH BUTTONS (shown when not logged in) -->
<div id="authButtons" style="position:fixed; top:18px; right:18px; display:flex; gap:12px;">
  <button onclick="signIn()" style="padding:8px 18px;border-radius:20px;border:none;cursor:pointer;">Sign In</button>
  <button onclick="signUp()" style="padding:8px 18px;border-radius:20px;border:none;cursor:pointer;">Sign Up</button>
</div>

<!-- PROFILE (hidden initially) -->
<div class="profile" id="profile" style="display:none;">AB</div>

<!-- Watermark -->
<div class="watermark" id="watermark">Berry</div>

<!-- CHAT AREA (hidden initially) -->
<div id="chatArea"
     style="position:absolute;
            top:120px;
            left:50%;
            transform:translateX(-50%);
            width:min(90%,700px);
            max-height:55vh;
            overflow-y:auto;
            display:none;
            flex-direction:column;
            gap:15px;">
</div>

<!-- Prompt (UNCHANGED STRUCTURE) -->
<div class="prompt-container">
  <button class="icon-btn"><span class="material-icons">add</span></button>

  <input
    type="text"
    class="prompt-input"
    id="promptInput"
    placeholder="Ask anything..."
    oninput="toggleIcon()"
    onkeydown="if(event.key==='Enter') sendMessage()"
  >

  <button class="icon-btn"><span class="material-icons">mic</span></button>

  <button class="send-btn" onclick="sendMessage()">
    <span class="material-icons" id="actionIcon">graphic_eq</span>
  </button>
</div>

<!-- Bottom Right Tools -->
<div class="bottom-tools">
  <button onclick="newChat()"><span class="material-icons">edit</span></button>
  <button><span class="material-icons">search</span></button>
  <button><span class="material-icons">image</span></button>
</div>

<script>

let chatStarted = false;
let loggedIn = false;

function toggleIcon() {
  const input = document.getElementById("promptInput");
  const icon = document.getElementById("actionIcon");
  icon.textContent = input.value.trim() ? "send" : "graphic_eq";
}

function startChatMode() {
  if (!chatStarted) {
    document.getElementById("watermark").style.display = "none";
    document.getElementById("chatArea").style.display = "flex";
    chatStarted = true;
  }
}

function addMessage(text, type) {
  const msg = document.createElement("div");
  msg.style.padding = "12px 16px";
  msg.style.borderRadius = "18px";
  msg.style.maxWidth = "70%";
  msg.style.wordWrap = "break-word";

  if (type === "user") {
    msg.style.alignSelf = "flex-end";
    msg.style.background = "rgba(255,255,255,0.8)";
  } else {
    msg.style.alignSelf = "flex-start";
    msg.style.background = "rgba(0,0,0,0.3)";
    msg.style.color = "white";
  }

  msg.innerText = text;
  const chat = document.getElementById("chatArea");
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById("promptInput");
  const text = input.value.trim();
  if (!text) return;

  startChatMode();
  addMessage(text, "user");
  input.value = "";
  toggleIcon();

  const formData = new FormData();
  formData.append("prompt", text);

  const res = await fetch("/chat", {
    method: "POST",
    body: formData
  });

  const data = await res.json();
  addMessage(data.reply, "bot");
}

function newChat() {
  document.getElementById("chatArea").innerHTML = "";
  document.getElementById("watermark").style.display = "block";
  document.getElementById("chatArea").style.display = "none";
  chatStarted = false;
}

function signIn() {
  alert("Sign In page coming next step.");
}

function signUp() {
  alert("Sign Up page coming next step.");
}

</script>

</body>
